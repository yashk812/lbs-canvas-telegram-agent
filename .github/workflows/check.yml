name: Check setup

# Run this once after adding your DOTENV secret: Actions tab -> "Check setup" ->
# Run workflow. It reports Canvas / calendar / Telegram status and sends a test message.
on:
  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - name: Write .env from the DOTENV secret
        env:
          DOTENV: ${{ secrets.DOTENV }}
        run: printf '%s\n' "$DOTENV" > .env
      - name: Validate configuration
        run: python -m canvas_agent.run --check
